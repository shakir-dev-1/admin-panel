name: CI/CD - Main Branch Deployment

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd /var/www/marvalero-admin
            git stash
            git fetch --all
            git checkout main
            git pull origin main
            # Install dependencies and generate/prisma setup
            cd backend
            npm install --force
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            # Restart with PM2 on custom port (e.g., 3003 and websocket 3004)
            pm2 delete marvalero-admin-backend || true
            pm2 start dist/main.js --name marvalero-admin-backend

            # --- Frontend deploy ---

            cd ../frontend
            npm ci
            npm run build

            pm2 delete marvalero-admin-frontend || true
            pm2 start npm --name marvalero-admin-frontend -- run start -- -p 5000
